<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Max</title>
  <meta name="description" content="Mobile-first social media app for sharing photos, stories, short videos (Reels), and real-time messaging." />
  <link rel="icon" href="/logo.jpg" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #0f0f14; color: #f4f4f6; text-align: center; }
    main { padding: 2rem; max-width: 32rem; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 1rem 0 .5rem; font-size: 2rem; }
    p { color: #b8b8c4; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.jpg" alt="Star Max logo" />
    <h1>Star Max</h1>
    <p>A mobile-first social app for sharing photos, stories, Reels, and real-time messages. Coming soon to Android.</p>
  </main>
</body>
</html>
